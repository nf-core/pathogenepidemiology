name: "nf-test Action"
description: "Runs nf-test with common setup steps"
inputs:
  profile:
    description: "Profile to use"
    required: true
  shard:
    description: "Shard number for this CI job"
    required: true
  total_shards:
    description: "Total number of test shards(NOT the total number of matrix jobs)"
    required: true
  paths:
    description: "Test paths"
    required: true
  tags:
    description: "Tags to pass as argument for nf-test --tag parameter"
    required: false
runs:
  using: "composite"
  steps:
    - name: Setup Nextflow
      uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
      with:
        version: "${{ env.NXF_VERSION }}"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    - name: Install nf-test
      uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
      with:
        version: "${{ env.NFT_VER }}"
        install-pdiff: true

    - name: Setup apptainer
      if: contains(inputs.profile, 'singularity')
      uses: eWaterCycle/setup-apptainer@95b5c781df5f72fd2271cc3cff06904a09d2a087 # v3

    - name: Set up Singularity
      if: contains(inputs.profile, 'singularity')
      shell: bash
      run: |
        mkdir -p $NXF_SINGULARITY_CACHEDIR
        mkdir -p $NXF_SINGULARITY_LIBRARYDIR

    - name: Conda setup
      if: contains(inputs.profile, 'conda')
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        auto-update-conda: true
        conda-solver: libmamba
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true

    - name: Run nf-test
      shell: bash
      env:
        NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
      run: |
        nf-test test \
          --profile=+${{ inputs.profile }} \
          $(if [ -n "${{ inputs.tags }}" ]; then echo "--tag ${{ inputs.tags }}"; fi) \
          --ci \
          --changed-since HEAD^ \
          --verbose \
          --tap=test.tap \
          --shard ${{ inputs.shard }}/${{ inputs.total_shards }}

          # Save the absolute path of the test.tap file to the output
          echo "tap_file_path=$(realpath test.tap)" >> $GITHUB_OUTPUT

    - name: Generate test summary
      if: always()
      shell: bash
      run: |
        # Add header if it doesn't exist (using a token file to track this)
        if [ ! -f ".summary_header" ]; then
          echo "# 🚀 nf-test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Test Name | Profile | Shard |" >> $GITHUB_STEP_SUMMARY
          echo "|:------:|-----------|---------|-------|" >> $GITHUB_STEP_SUMMARY
          touch .summary_header
        fi

        if [ -f test.tap ]; then
          while IFS= read -r line; do
            if [[ $line =~ ^ok ]]; then
              test_name="${line#ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ✅ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            elif [[ $line =~ ^not\ ok ]]; then
              test_name="${line#not ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ❌ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            fi
          done < test.tap
        else
          echo "| ⚠️ | No test results found | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
        fi
    - name: Collect malaria WGS diagnostics
      if: ${{ always() && env.DIAGNOSTIC_CAPTURE == 'true' }}
      shell: bash
      run: |
        DIAG_ROOT="$GITHUB_WORKSPACE/~/tests/9ef673cb3ea078c3a831c860bff579/work"
        DIAG_DIR="$RUNNER_TEMP/pathogenepidemiology-diagnostics"
        mkdir -p "$DIAG_DIR"

        if [ ! -d "$DIAG_ROOT" ]; then
          echo "nf-test work directory not found: $DIAG_ROOT"
          exit 0
        fi

        CHECKSUM_REPORT="$DIAG_ROOT/.malaria-reference-index-checksums.txt"
        {
          echo "Reference FASTA and BWA-MEM3 index checksums"
          echo "Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              echo "File: ${file#"$DIAG_ROOT"/}"
              stat -c "Size: %s bytes" "$file"
              sha256sum "$file"
              echo
            fi
          done < <(
            find "$DIAG_ROOT" \( -type f -o -type l \) \
              \( -name 'Pf3D7_chr1.fa' -o -name 'Pf3D7_chr1.fa.*' \) \
              -print0 | sort -z
          )
        } > "$CHECKSUM_REPORT"

        cd "$DIAG_ROOT"
        find . -type f \( \
          -name '*.bam' -o \
          -name '*.bai' -o \
          -name '*.csi' -o \
          -name '*.stats' -o \
          -name '*.stats.txt' -o \
          -name '.command.log' -o \
          -name '.command.err' -o \
          -name '.command.out' -o \
          -name '.malaria-reference-index-checksums.txt' \
        \) -print0 > "$DIAG_DIR/files.txt"

        if [ -s "$DIAG_DIR/files.txt" ]; then
          tar --null -czf "$DIAG_DIR/malaria-wgs-diagnostics.tar.gz" \
            -T "$DIAG_DIR/files.txt"
          echo "Diagnostic archive created."
        else
          echo "No matching diagnostic files found."
        fi

    - name: Upload malaria WGS diagnostics
      if: ${{ always() && env.DIAGNOSTIC_CAPTURE == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: malaria-wgs-shard6-diagnostics
        path: ${{ runner.temp }}/pathogenepidemiology-diagnostics/malaria-wgs-diagnostics.tar.gz
        if-no-files-found: warn
        retention-days: 3
    - name: Clean up
      if: always()
      shell: bash
      run: |
        sudo rm -rf /home/ubuntu/tests/
