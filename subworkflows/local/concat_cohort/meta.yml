# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: concat_cohort
description: Concatenate indexed per-contig cohort VCFs in reference index (sequence dictionary) order using ordinal staging names.
keywords:
  - vcf
  - cohort
  - concat
components:
  - stage_cohort_vcfs
  - bcftools/concat
input:
  - ch_records:
      description: "Per-contig records: [ val(meta), path(vcf), path(index) ]. meta.id must be a unique reference contig."
  - ch_queryfai:
      description: "Reusable reference FASTA index: [ val(meta), path(fai) ]."
output:
  - vcf:
      description: "Concatenated cohort variants: [ val(meta), path(vcf) ]."
  - index:
      description: "Cohort variant index: [ val(meta), path(index) ]."
authors: []
