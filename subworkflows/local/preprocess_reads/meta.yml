# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: preprocess_reads
description: Run FastQC and two-stage BBDuk on non-ONT reads, and NanoPlot and Filtlong on ONT reads.
keywords:
  - nanopore
  - quality control
  - trimming
  - filtering
components:
  - fastqc
  - bbduk_custom
  - nanoplot
  - filtlong
input:
  - ch_samples:
      description: "Sample metadata and reads. Structure: [ val(meta), path(reads) ]; meta includes single_end and instrument_platform."
  - ch_hostfasta:
      description: Reusable host FASTA path or empty list for short-read filtering only.
output:
  - reads_clean:
      description: "Filtered non-ONT reads. Structure: [ val(meta), path(reads) ]"
  - bbduk_stats:
      description: "Trimming and filtering statistics. Structure: [ val(meta), path(stats) ]"
  - bbduk_logs:
      description: "Trimming and filtering logs. Structure: [ val(meta), path(log) ]"
  - bbduk_dropped:
      description: "Reads discarded during filtering. Structure: [ val(meta), path(reads) ]"
  - fastqc:
      description: "Non-ONT FastQC ZIP reports. Structure: [ val(meta), path(zip) ]"
  - ont_reads:
      description: "Length-filtered ONT reads. Structure: [ val(meta), path(reads) ]"
  - nanoplot:
      description: "Raw ONT NanoPlot statistics for MultiQC. Structure: [ val(meta), path(txt) ]"
  - filtlong_log:
      description: "ONT Filtlong logs. Structure: [ val(meta), path(log) ]"
authors: []
