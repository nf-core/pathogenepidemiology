# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: prepare_references
description: Prepare local or downloaded references, reusing adjacent query indexes and building a shared minimap2 index when ONT reads are present.
keywords:
  - reference
  - fasta
  - indexing
components:
  - wget
  - gunzip
  - samtools/faidx
  - gatk4/createsequencedictionary
  - bwamem3/index
  - find/concatenate
  - falint
  - minimap2/index
input:
  - queryurl:
      type: string
      description: URL of the plain or gzip-compressed query FASTA, used when query_fasta is absent.
  - hosturl:
      type: string
      description: Optional URL of the plain or gzip-compressed host reference, used when host_fasta is absent.
  - query_fasta:
      type: string
      description: Optional existing local FASTA overriding queryurl; exact adjacent uncompressed-name .fai, .dict and complete BWA-MEM3 auxiliary files are reused.
  - host_fasta:
      type: string
      description: Optional existing local .fa, .fasta or .fna file (optionally .gz), overriding hosturl.
  - ch_ont_present:
      description: Emits true once when the validated samplesheet contains ONT reads; otherwise empty.
output:
  - queryfasta:
      description: "Decompressed query reference. Structure: [ val(meta), path(fasta) ]"
  - queryfai:
      description: "Query FASTA index. Structure: [ val(meta), path(fai) ]"
  - hostfasta:
      description: Plain host reference path without metadata, or an empty path value when absent.
  - querydict:
      description: "Query sequence dictionary. Structure: [ val(meta), path(dict) ]"
  - querybwamem3:
      description: "Five exact original BWA-MEM3 auxiliary file paths or a generated index directory. Structure: [ val(meta), path(index) ]"
  - ont_index:
      description: "Shared ONT minimap2 index of the query FASTA alone or the validated combined query and host FASTA. Structure: [ val(meta), path(index) ]"
authors: []
