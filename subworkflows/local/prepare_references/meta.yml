# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: prepare_references
description: Prepare local or downloaded references, reusing adjacent query indexes and building missing index classes.
keywords:
  - reference
  - fasta
  - indexing
components:
  - wget
  - gunzip
  - samtools/faidx
  - gatk4/createsequencedictionary
  - minimap2/index
  - bwamem3/index
  - reuse_reference
input:
  - queryurl:
      type: string
      description: URL of the plain or gzip-compressed query FASTA, used when query_fasta is absent.
  - hosturl:
      type: string
      description: Optional URL of the plain or gzip-compressed host reference, used when host_fasta is absent.
  - query_fasta:
      type: string
      description: Optional existing local FASTA overriding queryurl; exact adjacent uncompressed-name .fai, .dict, .mmi and complete BWA-MEM3 companions are reused.
  - host_fasta:
      type: string
      description: Optional existing local .fa, .fasta or .fna file (optionally .gz), overriding hosturl.
output:
  - queryfasta:
      description: "Decompressed query reference. Structure: [ val(meta), path(fasta) ]"
  - queryfai:
      description: "Query FASTA index. Structure: [ val(meta), path(fai) ]"
  - hostfasta:
      description: Plain host reference path without metadata, or an empty path value when absent.
  - querydict:
      description: "Query sequence dictionary. Structure: [ val(meta), path(dict) ]"
  - querymmi:
      description: "Selected or built minimap2 index. Structure: [ val(meta), path(mmi) ]"
  - querybwamem3:
      description: "Selected or built BWA-MEM3 index directory containing only its five sidecars. Structure: [ val(meta), path(index) ]"
authors: []
