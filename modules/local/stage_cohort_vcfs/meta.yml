name: stage_cohort_vcfs
description: Preserve reference-ordered VCF/index pairs as ordinal filename aliases before nf-core concat sorts its inputs.
keywords:
  - vcf
  - staging
  - cohort
tools:
  - bash:
      description: Create symbolic links with deterministic ordinal names.
      homepage: https://www.gnu.org/software/bash/
      licence: [GPL-3.0-or-later]
input:
  - - meta:
        type: map
        description: Cohort metadata.
    - vcfs:
        type: file
        description: Gzip-compressed per-contig VCFs, already ordered by reference.
    - indices:
        type: file
        description: Corresponding tabix indices in the same order.
output:
  - vcfs:
      - meta:
          type: map
          description: Cohort metadata.
      - ordered/*.vcf.gz:
          type: file
          description: Ordinal VCF aliases.
      - ordered/*.vcf.gz.tbi:
          type: file
          description: Matching ordinal index aliases.
authors: []
maintainers: []
