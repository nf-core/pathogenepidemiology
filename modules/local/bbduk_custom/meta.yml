name: bbmap_bbduk
description: Reusable BBDuk read trimming or filtering with reference statistics and discarded reads
keywords:
  - trimming
  - adapter trimming
  - quality trimming
  - filtering
  - fastq
tools:
  - bbmap:
      description: BBMap is a short read aligner, as well as various other
        bioinformatic tools.
      homepage: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      documentation: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      licence:
        - "UC-LBL license (see package)"
      identifier: biotools:bbmap
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: |
          List of input FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
        ontologies: []
  - references:
      type: file
      description: |
        Reference path or list of paths; [] uses only built-in references supplied
        through task.ext.reference. Configure trimming/filtering mode via task.ext.args.
        Output naming uses task.ext.suffix (default trimmed) for reads, rejects,
        logs, and stats.
      ontologies: []
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_${suffix}.fastq.gz":
          type: file
          description: Retained reads after trimming or filtering
          pattern: "*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bbduk.log":
          type: file
          description: Stage-specific BBDuk log file
          pattern: "*.bbduk.log"
          ontologies: []
  discarded:
    - - meta:
          type: map
          description: Sample metadata
      - "*.discarded.fastq.gz":
          type: file
          description: Trimming/length rejects in trimming mode or whole-read matches in filtering mode
  stats:
    - - meta:
          type: map
          description: Sample metadata
      - "*.stats.txt":
          type: file
          description: Stage-specific reference match statistics
  versions_bbmap:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@MGordon09"
maintainers:
  - "@MGordon09"
